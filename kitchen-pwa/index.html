<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cauliflower Olive Almond Pasta</title>
<meta name="description" content="Cook mode and Whole Foods shopping list for roasted cauliflower, green olive and almond pasta.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pasta">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f3f4ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141711" media="(prefers-color-scheme: dark)">
<style>:root{padding-top:env(safe-area-inset-top,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap">
<style>
/* Layout: kitchen cook-mode — ingredients rail + one big step at a time, thumb-reach nav pinned to the bottom */
:root{
  --bg:#f3f4ee; --surface:#ffffff; --ink:#1d2219; --muted:#5d6656; --line:#d9ddd0;
  --olive:#5a6b1e; --olive-soft:#e7ecd2; --almond:#b07a3c; --alert:#c2412d; --on-olive:#ffffff;
  --display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141711; --surface:#1d2119; --ink:#eef0e6; --muted:#a3ab97; --line:#343a2c;
  --olive:#b4c96a; --olive-soft:#2b3320; --almond:#d9a466; --alert:#ff7a62; --on-olive:#141711; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141711; --surface:#1d2119; --ink:#eef0e6; --muted:#a3ab97; --line:#343a2c;
  --olive:#b4c96a; --olive-soft:#2b3320; --almond:#d9a466; --alert:#ff7a62; --on-olive:#141711; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(110px + env(safe-area-inset-bottom,0px))}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,label:focus-within{outline:3px solid var(--almond);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto}

header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;padding-block:22px 16px}
h1{font-family:var(--display);font-weight:800;font-size:clamp(1.5rem,3.6vw,2.3rem);line-height:1.08;margin:0;text-wrap:balance;letter-spacing:-.01em}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;color:var(--muted);font-size:.9rem}
.pill{border:1px solid var(--line);border-radius:999px;padding:4px 12px;background:var(--surface)}
.pill.on{border-color:var(--olive);color:var(--olive)}

.steps-nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:16px;scrollbar-width:none}
.steps-nav button{flex:1 0 auto;min-width:96px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px;text-align:left;font-size:.85rem;line-height:1.2}
.steps-nav button b{display:block;font-family:var(--display);font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.steps-nav button.cur{background:var(--olive);border-color:var(--olive);color:var(--on-olive)}
.steps-nav button.cur b{color:inherit;opacity:.8}
.steps-nav button.done{color:var(--muted)}
.steps-nav button.done b::after{content:" ✓"}

.grid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;align-items:start}
.step{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:clamp(20px,4vw,40px);min-width:0}
.eyebrow{font-family:var(--display);font-weight:600;letter-spacing:.1em;text-transform:uppercase;font-size:.8rem;color:var(--olive)}
.step h2{font-family:var(--display);font-weight:800;font-size:clamp(1.8rem,4.5vw,2.8rem);line-height:1.05;margin:.2em 0 .5em;text-wrap:balance}
.step ol{margin:0;padding:0;list-style:none;display:grid;gap:14px}
.step li{font-size:clamp(1.15rem,2.3vw,1.45rem);line-height:1.45;padding-left:30px;position:relative;max-width:40ch}
.step li::before{content:"";position:absolute;left:4px;top:.55em;width:12px;height:12px;border-radius:50%;border:2.5px solid var(--olive)}
.step li em{font-style:normal;font-weight:700}
.warn{margin-top:20px;padding:12px 16px;border-radius:12px;background:var(--olive-soft);font-size:1rem;max-width:52ch}
.warn strong{color:var(--almond)}
.uses{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.uses span{font-size:.9rem;border:1px dashed var(--line);border-radius:8px;padding:4px 10px;color:var(--muted)}
.timer-btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.tbtn{border:2px solid var(--olive);background:transparent;color:var(--olive);border-radius:12px;padding:10px 16px;font-weight:700}
.tbtn:hover{background:var(--olive-soft)}

aside{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px 18px 10px;position:sticky;top:12px;min-width:0}
aside h3{font-family:var(--display);font-weight:800;font-size:1.15rem;margin:0}
.asidehead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:10px}
.scale{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;font-size:.85rem}
.scale button{border:0;background:transparent;padding:4px 10px}
.scale button.on{background:var(--olive);color:var(--on-olive)}
.ing{list-style:none;margin:0;padding:0}
.ing li{border-top:1px solid var(--line)}
.ing label{display:flex;gap:12px;align-items:flex-start;padding:10px 2px;cursor:pointer}
.ing input{width:22px;height:22px;margin:2px 0 0;accent-color:var(--olive);flex:none}
.ing .q{font-weight:700;font-variant-numeric:tabular-nums}
.ing .n{display:block;font-size:.85rem;color:var(--muted)}
.ing input:checked + span{opacity:.45;text-decoration:line-through}
.ing li.hl{background:var(--olive-soft);border-radius:8px}
.nutri{font-size:.8rem;color:var(--muted);border-top:1px solid var(--line);padding-top:10px;margin-top:4px;font-variant-numeric:tabular-nums}

/* timers tray */
#tray{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(96px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;z-index:20;max-width:calc(100% - 32px)}
.timer{display:flex;align-items:center;gap:12px;background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 12px 10px 16px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.timer .t{font-family:var(--display);font-weight:800;font-size:1.5rem;font-variant-numeric:tabular-nums;min-width:4.2ch}
.timer .l{font-size:.85rem;line-height:1.2;max-width:16ch}
.timer button{border:0;background:transparent;color:inherit;opacity:.7;font-size:1.1rem;padding:4px 8px}
.timer.ring{background:var(--alert);color:#fff;animation:pulse 1s infinite}
.timer.ring button{opacity:1;font-weight:700;font-size:.95rem;border:2px solid #fff;border-radius:8px}
@keyframes pulse{50%{transform:scale(1.03)}}

/* bottom nav */
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);z-index:15;
  padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.bar .wrap{display:flex;gap:12px;align-items:center}
.bar button{border-radius:14px;padding:16px 20px;font-weight:700;font-size:1.1rem;border:2px solid var(--line);background:var(--surface)}
.bar #next{flex:1;background:var(--olive);border-color:var(--olive);color:var(--on-olive)}
.bar #prev:disabled{opacity:.35;cursor:default}
.bar #ingBtn{display:none}
.prog{height:4px;background:var(--line);border-radius:4px;flex:1;max-width:160px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--olive);transition:width .25s}

@media (max-width:820px){
  .grid{grid-template-columns:minmax(0,1fr)}
  aside{position:fixed;inset:auto 0 0 0;border-radius:18px 18px 0 0;z-index:30;max-height:80%;overflow:auto;
    padding:18px max(18px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));
    transform:translateY(105%);transition:transform .25s;box-shadow:0 -10px 30px rgba(0,0,0,.25)}
  aside.open{transform:none}
  .bar #ingBtn{display:block}
  .prog{display:none}
  #scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:25}
  .closeIng{display:inline-block!important}
}
.closeIng{display:none;border:0;background:transparent;font-size:1.4rem;padding:0 4px}
/* mode switch + shopping */
.modes{display:flex;border:2px solid var(--olive);border-radius:12px;overflow:hidden}
.modes button{border:0;background:transparent;padding:8px 18px;font-weight:700;color:var(--olive)}
.modes button.on{background:var(--olive);color:var(--on-olive)}
#shop{display:none}
body.shopping #shop{display:block}
body.shopping .grid, body.shopping #stepsNav, body.shopping #prev, body.shopping #ingBtn, body.shopping .prog{display:none!important}
.shophead{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:14px}
.shophead p{margin:0;color:var(--muted);font-size:.95rem}
.shoptools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ghost{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;font-weight:700;font-size:.9rem}
.aisles{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:16px;align-items:start}
.aisle{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px 18px 8px;min-width:0}
.aisle h3{font-family:var(--display);font-weight:800;font-size:1.1rem;margin:0 0 2px;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.aisle h3 small{font-family:var(--body);font-weight:400;font-size:.8rem;color:var(--muted)}
.aisle.done h3{color:var(--muted)}
.aisle.done h3::after{content:"✓";color:var(--olive)}
.sitem{border-top:1px solid var(--line)}
.sitem:first-of-type{border-top:0}
.sitem label{display:flex;gap:14px;align-items:flex-start;padding:12px 2px;cursor:pointer}
.sitem input{width:26px;height:26px;margin:1px 0 0;accent-color:var(--olive);flex:none}
.sitem .what{font-size:1.15rem;font-weight:700;line-height:1.3}
.sitem .amt{font-variant-numeric:tabular-nums;color:var(--olive)}
.sitem .tip{display:block;font-size:.88rem;color:var(--muted);font-weight:400;margin-top:2px}
.sitem input:checked + span .what{text-decoration:line-through;opacity:.45}
.sitem input:checked + span .tip{display:none}
.pantry-note{font-size:.85rem;color:var(--muted);margin:2px 0 6px}
#copied{font-size:.85rem;color:var(--olive)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="eyebrow">Cook mode · Healthy College Cookbook p.155</div>
      <h1>Roasted Cauliflower, Green Olive &amp; Almond Pasta</h1>
    </div>
    <div class="meta">
      <div class="modes" role="tablist" aria-label="Mode">
        <button id="modeShop" role="tab">Shop</button><button id="modeCook" role="tab" class="on">Cook</button>
      </div>
      <span class="pill">450°F oven</span>
      <span class="pill">~50 min</span>
      <span class="pill" id="wake">Screen may sleep</span>
    </div>
  </header>

  <section id="shop" aria-label="Shopping list">
    <div class="shophead">
      <p>Whole Foods list, in store order. <span id="shopCount"></span></p>
      <div class="shoptools">
        <div class="scale" role="group" aria-label="Batch size" id="shopScale">
          <button data-s="0.5">½×</button><button data-s="1">1×</button><button data-s="2">2×</button>
        </div>
        <button class="ghost" id="copyList">Copy list</button>
        <button class="ghost" id="resetList">Clear checks</button>
        <span id="copied" aria-live="polite"></span>
      </div>
    </div>
    <div class="aisles" id="aisles"></div>
  </section>

  <nav class="steps-nav" id="stepsNav" aria-label="Steps"></nav>

  <div class="grid">
    <section class="step" id="step" aria-live="polite"></section>
    <aside id="ingPanel" aria-label="Ingredients">
      <div class="asidehead">
        <h3>Ingredients</h3>
        <div style="display:flex;gap:8px;align-items:center">
          <div class="scale" role="group" aria-label="Batch size">
            <button data-s="0.5" id="s05">½×</button><button data-s="1" id="s1" class="on">1×</button><button data-s="2" id="s2">2×</button>
          </div>
          <button class="closeIng" id="closeIng" aria-label="Close ingredients">×</button>
        </div>
      </div>
      <ul class="ing" id="ing"></ul>
      <p class="nutri"><span id="serv">Serves 4–6</span> · per serving: 460 cal · 16 g protein · 64 g carbs · 17 g fat · 6 g fiber</p>
    </aside>
  </div>
</div>

<div id="tray" aria-live="assertive"></div>
<div id="scrim" hidden></div>

<div class="bar">
  <div class="wrap">
    <button id="prev" aria-label="Previous step">←</button>
    <button id="ingBtn">Ingredients</button>
    <div class="prog" aria-hidden="true"><i id="progBar"></i></div>
    <button id="next">Next step →</button>
  </div>
</div>

<script>
const ING = [
  {id:"cauli", q:1, u:"large head", n:"cauliflower", note:"chopped into small pieces"},
  {id:"oil", q:0.25, u:"cup", n:"extra-virgin olive oil", note:"plus a little extra for roasting"},
  {id:"salt", q:null, n:"salt & black pepper", note:"sea salt is best"},
  {id:"parsley", q:1, u:"cup", n:"fresh parsley leaves", note:"or more"},
  {id:"olives", q:[0.5,0.75], u:"cup", n:"pitted green olives"},
  {id:"almonds", q:0.5, u:"cup", n:"almonds", note:"toasted (Step 1)"},
  {id:"pasta", q:1, u:"lb", n:"pasta", note:"capellini is a good choice"},
  {id:"parm", q:null, n:"Parmesan", note:"freshly grated, to serve"}
];
const STEPS = [
  {short:"Prep", title:"Heat oven & prep",
   items:["Preheat the oven to <em>450°F</em>.","Chop the cauliflower into <em>small pieces</em>.","Toast the almonds in a <em>dry skillet over medium heat</em>, keeping them moving, until golden brown."],
   warn:"<strong>Watch the almonds.</strong> Once they start to brown they burn fast. Pull them off the heat right away.",
   uses:["cauli","almonds"], timers:[{m:4,l:"Almonds (check)"}]},
  {short:"Roast", title:"Roast the cauliflower",
   items:["Toss the cauliflower with <em>a little olive oil</em> until evenly coated.","Spread on a baking sheet. Sprinkle with salt and pepper.","Roast <em>30–40 min</em> until golden and tender, <em>flipping every 10 min</em>."],
   warn:"The roast timer chimes every 10 minutes as a flip reminder.",
   uses:["cauli","oil","salt"], timers:[{m:35,l:"Cauliflower roast",flip:10}]},
  {short:"Sauce", title:"Blend the parsley sauce",
   items:["While the cauliflower roasts, add the <em>parsley, ¼ cup olive oil, olives and almonds</em> to a food processor.","Blend until combined and the olives and almonds are <em>chopped well</em>.","Season with salt and pepper to taste."],
   uses:["parsley","oil","olives","almonds","salt"], timers:[]},
  {short:"Pasta", title:"Cook the pasta",
   items:["Bring a large pot of water to a boil. <em>Salt it well.</em>","Add the pasta and cook <em>al dente</em> per the package.","Drain."],
   warn:"Time this so the pasta finishes about when the cauliflower comes out.",
   uses:["pasta","salt"], timers:[{m:4,l:"Capellini"},{m:9,l:"Thicker pasta"}]},
  {short:"Finish", title:"Toss & serve",
   items:["Toss the pasta with the <em>roasted cauliflower</em> and the <em>parsley mixture</em>.","Taste and season again with salt and pepper if needed.","Serve sprinkled with <em>Parmesan</em>."],
   warn:"Leftovers are even better the next day.",
   uses:["pasta","cauli","parm","salt"], timers:[]}
];

const store = { get(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}},
                set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}} };
let cur = Math.min(store.get("cur",0), STEPS.length-1);
let scale = store.get("scale",1);
let checked = new Set(store.get("checked",[]));
const $ = id => document.getElementById(id);

function frac(x){
  const whole=Math.floor(x), r=+(x-whole).toFixed(3);
  const map={0:"",0.25:"¼",0.5:"½",0.75:"¾",0.125:"⅛",0.375:"⅜",0.333:"⅓"};
  const f = map[r] ?? r.toString();
  return (whole? whole+(f?" ":""):"") + f || "0";
}
function qty(i){
  if(i.q===null) return "";
  if(Array.isArray(i.q)) return frac(i.q[0]*scale)+"–"+frac(i.q[1]*scale)+" "+i.u;
  let u=i.u, v=i.q*scale;
  if(u==="large head" && v!==1) u = v<1 ? "head" : "large heads";
  return frac(v)+" "+u;
}
function renderIng(){
  const uses = STEPS[cur].uses;
  $("ing").innerHTML = ING.map(i=>`<li class="${uses.includes(i.id)?"hl":""}"><label><input type="checkbox" id="ing-${i.id}" data-id="${i.id}" ${checked.has(i.id)?"checked":""}><span>${i.q!==null?`<span class="q">${qty(i)}</span> `:""}${i.n}${i.note?`<span class="n">${i.note}</span>`:""}</span></label></li>`).join("");
  $("serv").textContent = "Serves " + (scale===0.5?"2–3":scale===2?"8–12":"4–6");
  document.querySelectorAll(".scale button").forEach(b=>b.classList.toggle("on", +b.dataset.s===scale));
}
function renderStep(){
  const s=STEPS[cur];
  $("step").innerHTML = `<div class="eyebrow">Step ${cur+1} of ${STEPS.length}</div><h2>${s.title}</h2>
    <ol>${s.items.map(t=>`<li>${t}</li>`).join("")}</ol>
    ${s.warn?`<p class="warn">${s.warn}</p>`:""}
    ${s.timers.length?`<div class="timer-btns">${s.timers.map((t,k)=>`<button class="tbtn" data-k="${k}">▶ ${t.m} min · ${t.l}</button>`).join("")}<button class="tbtn" data-k="custom">+ Custom</button></div>`:""}
    <div class="uses">${s.uses.map(u=>{const i=ING.find(x=>x.id===u);return `<span>${i.q!==null?qty(i)+" ":""}${i.n}</span>`}).join("")}</div>`;
  $("stepsNav").innerHTML = STEPS.map((x,k)=>`<button data-k="${k}" class="${k===cur?"cur":k<cur?"done":""}" aria-current="${k===cur?"step":"false"}"><b>Step ${k+1}</b>${x.short}</button>`).join("");
  $("prev").disabled = cur===0;
  $("next").textContent = cur===STEPS.length-1 ? "Done — start over" : `Next: ${STEPS[cur+1].short} →`;
  if(typeof mode!=="undefined"&&mode==="shop") $("next").textContent="Done shopping · Start cooking →";
  $("progBar").style.width = ((cur+1)/STEPS.length*100)+"%";
  renderIng();
  store.set("cur",cur);
}
function go(k){ cur=(k+STEPS.length)%STEPS.length; renderStep(); window.scrollTo({top:0,behavior:"smooth"}); }

/* ---- shopping ---- */
const AISLES = [
  {name:"Produce", where:"front of store", items:[
    {id:"cauli", what:"Cauliflower", amt:s=>{const n=Math.ceil(s);return `${n} large head${n>1?"s":""}`}, tip:"Tight, creamy-white florets, no brown spots. About 2½–3 lb per head."},
    {id:"parsley", what:"Flat-leaf parsley", amt:s=>{const n=Math.ceil(s);return `${n} bunch${n>1?"es":""}`}, tip:"One bunch gives about a cup of leaves. Flat-leaf blends better than curly."}
  ]},
  {name:"Olive bar", where:"prepared foods", items:[
    {id:"olives", what:"Pitted green olives", amt:s=>`~${+(5*s).toFixed(1)} oz`, tip:"Sold by weight. Castelvetrano are mild and buttery. Confirm they're pitted."}
  ]},
  {name:"Bulk bins", where:"", items:[
    {id:"almonds", what:"Almonds", amt:s=>`~${+(2.5*s).toFixed(1)} oz (${frac(0.5*s)} cup)`, tip:"Dry-roasted unsalted lets you skip the toasting step."}
  ]},
  {name:"Pasta aisle", where:"", items:[
    {id:"pasta", what:"Capellini (angel hair)", amt:s=>s===0.5?"1 box (use half)":`${s} lb box${s>1?"es":""}`, tip:"365 by Whole Foods Market brand works fine. Spaghetti if they're out."}
  ]},
  {name:"Cheese counter", where:"specialty", items:[
    {id:"parm", what:"Parmigiano-Reggiano", amt:s=>`~${+(2*s).toFixed(1)} oz wedge`, tip:"A wedge you grate yourself tastes better than pre-grated tubs."}
  ]},
  {name:"Pantry staples", where:"check home first", pantry:true, items:[
    {id:"oil", what:"Extra-virgin olive oil", amt:s=>({0.5:"⅙ cup+",1:"⅓ cup+",2:"⅔ cup+"})[s], tip:"¼ cup for the sauce plus a bit for roasting."},
    {id:"salt", what:"Sea salt", amt:()=>"", tip:""},
    {id:"pepper", what:"Black peppercorns", amt:()=>"", tip:""}
  ]}
];
let shopChecked = new Set(store.get("shopChecked",[]));
function shopAmt(it){ const a=it.amt(scale); return a.replace(/\b0\.33\b/,"⅓"); }
function renderShop(){
  let left=0;
  $("aisles").innerHTML = AISLES.map(a=>{
    const done=a.items.every(i=>shopChecked.has(i.id));
    left += a.items.filter(i=>!shopChecked.has(i.id)).length;
    return `<div class="aisle ${done?"done":""}"><h3>${a.name}${a.where?` <small>${a.where}</small>`:""}</h3>
      ${a.pantry?`<p class="pantry-note">Tick anything you already have.</p>`:""}
      ${a.items.map(i=>`<div class="sitem"><label><input type="checkbox" id="shop-${i.id}" data-id="${i.id}" ${shopChecked.has(i.id)?"checked":""}><span><span class="what">${i.what}${shopAmt(i)?` <span class="amt">· ${shopAmt(i)}</span>`:""}</span>${i.tip?`<span class="tip">${i.tip}</span>`:""}</span></label></div>`).join("")}
    </div>`}).join("");
  $("shopCount").textContent = left ? `${left} left to grab.` : "All set. Time to cook.";
  document.querySelectorAll("#shopScale button").forEach(b=>b.classList.toggle("on", +b.dataset.s===scale));
}
$("aisles").onchange=e=>{const id=e.target.dataset.id; e.target.checked?shopChecked.add(id):shopChecked.delete(id); store.set("shopChecked",[...shopChecked]); renderShop()};
$("shopScale").onclick=e=>{const b=e.target.closest("button"); if(!b)return; scale=+b.dataset.s; store.set("scale",scale); renderShop(); renderStep()};
$("resetList").onclick=()=>{shopChecked.clear(); store.set("shopChecked",[]); renderShop()};
$("copyList").onclick=()=>{
  const txt="Whole Foods — Cauliflower Olive Almond Pasta\n"+AISLES.map(a=>{
    const need=a.items.filter(i=>!shopChecked.has(i.id)); if(!need.length) return "";
    return `\n${a.name.toUpperCase()}\n`+need.map(i=>`- ${i.what}${shopAmt(i)?" ("+shopAmt(i)+")":""}`).join("\n");
  }).join("");
  const ok=()=>{$("copied").textContent="Copied";setTimeout(()=>$("copied").textContent="",2000)};
  try{ navigator.clipboard.writeText(txt).then(ok,()=>fallback(txt)) }catch(e){ fallback(txt) }
  function fallback(t){const ta=document.createElement("textarea");ta.value=t;ta.style.cssText="position:fixed;opacity:0";document.body.appendChild(ta);ta.select();try{document.execCommand("copy");ok()}catch(e){$("copied").textContent="Select and copy manually"}ta.remove()}
};
let mode = location.hash==="#shop" ? "shop" : store.get("mode","cook");
function setMode(m){
  mode=m; store.set("mode",m);
  document.body.classList.toggle("shopping", m==="shop");
  $("modeShop").classList.toggle("on", m==="shop"); $("modeCook").classList.toggle("on", m==="cook");
  $("modeShop").setAttribute("aria-selected", m==="shop"); $("modeCook").setAttribute("aria-selected", m==="cook");
  if(m==="shop"){ renderShop(); $("next").textContent="Done shopping · Start cooking →"; openIng(false); }
  else renderStep();
  window.scrollTo({top:0});
}
$("modeShop").onclick=()=>setMode("shop");
$("modeCook").onclick=()=>setMode("cook");

$("prev").onclick=()=>cur>0&&go(cur-1);
$("next").onclick=()=>{ if(mode==="shop"){ cur=0; setMode("cook"); return; } go(cur===STEPS.length-1?0:cur+1) };
$("stepsNav").onclick=e=>{const b=e.target.closest("button"); if(b) go(+b.dataset.k)};
$("ing").onchange=e=>{const id=e.target.dataset.id; e.target.checked?checked.add(id):checked.delete(id); store.set("checked",[...checked])};
document.querySelector(".scale").onclick=e=>{const b=e.target.closest("button"); if(!b)return; scale=+b.dataset.s; store.set("scale",scale); renderStep()};
const openIng=v=>{$("ingPanel").classList.toggle("open",v); $("scrim").hidden=!v};
$("ingBtn").onclick=()=>openIng(true); $("closeIng").onclick=()=>openIng(false); $("scrim").onclick=()=>openIng(false);
document.addEventListener("keydown",e=>{
  if(e.target.tagName==="INPUT"||mode==="shop")return;
  if(e.key==="ArrowRight"||e.key===" "){e.preventDefault(); if(cur<STEPS.length-1)go(cur+1)}
  if(e.key==="ArrowLeft"&&cur>0)go(cur-1);
});
// swipe between steps on the step card
let sx=null,sy=null;
$("step").addEventListener("touchstart",e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
$("step").addEventListener("touchend",e=>{if(sx===null)return;const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;
  if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5){ if(dx<0&&cur<STEPS.length-1)go(cur+1); if(dx>0&&cur>0)go(cur-1);} sx=null},{passive:true});

/* ---- timers ---- */
let actx=null, timers=[], tid=0;
function beep(n=3){
  try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    for(let i=0;i<n;i++){const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=880;o.connect(g);g.connect(actx.destination);
      const t=actx.currentTime+i*0.35;g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.4,t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+0.25);o.start(t);o.stop(t+0.3);}
  }catch(e){}
  try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}
}
function addTimer(min,label,flip){
  try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)(); actx.resume&&actx.resume() }catch(e){}
  timers.push({id:++tid,label,end:Date.now()+min*60000,flip:flip?flip*60000:0,start:Date.now(),lastFlip:0,ring:false,ringAt:0});
  wake(); tick();
}
function fmt(ms){const s=Math.max(0,Math.ceil(ms/1000));return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")}
function tick(){
  const now=Date.now();
  timers.forEach(t=>{
    const left=t.end-now;
    if(left<=0&&!t.ring){t.ring=true;t.ringAt=0}
    if(t.ring&&now-t.ringAt>4000){beep(3);t.ringAt=now}
    if(t.flip&&!t.ring){const n=Math.floor((now-t.start)/t.flip); if(n>t.lastFlip){t.lastFlip=n;t.flipMsg=now;beep(2)}}
  });
  $("tray").innerHTML=timers.map(t=>{
    const flipping=t.flipMsg&&now-t.flipMsg<15000&&!t.ring;
    return `<div class="timer ${t.ring||flipping?"ring":""}"><span class="t">${t.ring?"0:00":fmt(t.end-now)}</span><span class="l">${t.ring?t.label+" is done":flipping?"Flip the cauliflower":t.label}</span>
    ${t.ring?`<button data-x="${t.id}">Stop</button>`:flipping?`<button data-f="${t.id}">OK</button>`:`<button data-p="${t.id}" aria-label="Add 1 minute">+1</button><button data-x="${t.id}" aria-label="Cancel timer">×</button>`}</div>`}).join("");
}
setInterval(()=>{if(timers.length)tick()},500);
$("tray").onclick=e=>{const b=e.target.closest("button");if(!b)return;
  if(b.dataset.x){timers=timers.filter(t=>t.id!=b.dataset.x)}
  if(b.dataset.f){const t=timers.find(t=>t.id==b.dataset.f);if(t)t.flipMsg=0}
  if(b.dataset.p){const t=timers.find(t=>t.id==b.dataset.p);if(t)t.end+=60000}
  tick()};
$("step").onclick=e=>{const b=e.target.closest(".tbtn");if(!b)return;
  if(b.dataset.k==="custom"){
    const box=b.parentElement; if(box.querySelector("#customMin"))return;
    box.insertAdjacentHTML("beforeend",`<span style="display:flex;gap:6px;align-items:center"><input id="customMin" type="number" min="1" max="180" value="5" inputmode="numeric" style="width:5em;padding:10px;border-radius:10px;border:2px solid var(--line);font:inherit;background:var(--surface);color:var(--ink)"><button class="tbtn" data-k="go">Start</button></span>`);
    $("customMin").focus(); return;}
  if(b.dataset.k==="go"){const m=Math.max(1,+$("customMin").value||5);addTimer(m,`${STEPS[cur].short} timer`);renderStep();return;}
  const t=STEPS[cur].timers[+b.dataset.k]; addTimer(t.m,t.l,t.flip)};

/* ---- keep screen awake ---- */
let lock=null;
async function wake(){
  try{ if(!lock&&navigator.wakeLock){ lock=await navigator.wakeLock.request("screen"); $("wake").textContent="Screen stays on"; $("wake").classList.add("on");
    lock.addEventListener("release",()=>{lock=null;$("wake").textContent="Screen may sleep";$("wake").classList.remove("on")}); } }catch(e){}
}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")wake()});
document.addEventListener("click",wake,{once:true});
wake();
setMode(mode);
</script>

<script>
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));}
</script>
</body>
</html>
